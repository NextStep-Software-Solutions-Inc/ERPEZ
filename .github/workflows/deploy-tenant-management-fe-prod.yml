name: Deploy Tenant Management FE to Vercel (Prod)

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths:
      - 'apps/tenant-management/**'
      - 'packages/erpez-shared-lib/**'
      - 'packages/ui/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - .github/workflows/deploy-tenant-management-fe-prod.yml
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual production deployment'
        required: false
        default: 'Manual frontend production release'
        type: string

env:
  APP_NAME: tenant-management
  ENVIRONMENT: Production

jobs:
  deploy:
    name: Deploy to Production Vercel
    runs-on: ubuntu-latest
    # environment: Production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_TENANT_MANAGEMENT }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (Production)
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_TENANT_MANAGEMENT }}
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
