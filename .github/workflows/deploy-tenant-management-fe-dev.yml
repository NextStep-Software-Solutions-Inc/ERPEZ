name: Deploy Tenant Management FE to Vercel (Dev)

on:
  push:
    branches:
      - development
    paths:
      - 'apps/tenant-management/**'
      - 'packages/erpez-shared-lib/**'
      - 'packages/ui/**'
      - .github/workflows/deploy-tenant-management-fe-dev.yml
  pull_request:
    branches:
      - development
    paths:
      - 'apps/tenant-management/**'
      - 'packages/erpez-shared-lib/**'
      - 'packages/ui/**'
      - .github/workflows/deploy-tenant-management-fe-dev.yml
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        required: false
        default: 'Manual frontend dev deployment'
        type: string

env:
  APP_NAME: tenant-management
  ENVIRONMENT: Development
  NODE_OPTIONS: '--max-old-space-size=6144'

jobs:
  deploy:
    name: Deploy to Vercel (Preview)
    runs-on: ubuntu-latest
    # environment: Development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_TENANT_MANAGEMENT }}
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_TENANT_MANAGEMENT }}
          NODE_OPTIONS: '--max-old-space-size=6144'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_TENANT_MANAGEMENT }}
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
