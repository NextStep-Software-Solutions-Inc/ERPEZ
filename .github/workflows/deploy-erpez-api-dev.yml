name: Deploy ERPEZ API to DigitalOcean Droplet (Dev)

on:
  push:
    branches:
      - development
    paths:
      - 'ERPEZ/**'
      - 'ERPEZ.Shared/**'
      - .github/workflows/deploy-erpez-api-dev.yml
  pull_request:
    branches:
      - development
    paths:
      - 'ERPEZ/**'
      - 'ERPEZ.Shared/**'
      - .github/workflows/deploy-erpez-api-dev.yml
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        required: false
        default: 'Manual deployment'
        type: string

env:
    CONTAINER_NAME: erpez-api
    IMAGE_TAG: dev
    ENVIRONMENT: Development

jobs:
  test:
    name: Run Tests and Validation Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Restore dependencies
      run: dotnet restore ERPEZ.sln
    
    - name: Build solution (treat warnings as errors)
      run: dotnet build ERPEZ.sln --no-restore --configuration Release /p:TreatWarningsAsErrors=true
    
    - name: Check Validation Coverage
      run: |
        echo "Checking FluentValidation coverage..."
        bash scripts/check-validators.sh
      shell: bash
      continue-on-error: false
    
    - name: Check DTO Contract Compliance
      run: |
        echo "Checking API contract compliance (DTOs vs Domain Entities)..."
        bash scripts/check-dto-contracts.sh
      shell: bash
      continue-on-error: false
    
    - name: Run Tests
      run: dotnet test ERPEZ.sln --no-build --configuration Release --verbosity normal --nologo
      continue-on-error: false

  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: Development
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: docker build -t ${{ env.CONTAINER_NAME }}:${{ env.IMAGE_TAG }} -f ERPEZ/Dockerfile .

    - name: Save Docker image
      run: docker save ${{ env.CONTAINER_NAME }}:${{ env.IMAGE_TAG }} | gzip > ${{ env.CONTAINER_NAME }}.tar.gz

    - name: Transfer image to droplet via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.DO_DROPLET_IP }}
        username: ${{ secrets.DO_DROPLET_USER }}
        key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
        source: ${{ env.CONTAINER_NAME }}.tar.gz
        target: /tmp/

    - name: Deploy on DigitalOcean Droplet
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.DO_DROPLET_IP }}
        username: ${{ secrets.DO_DROPLET_USER }}
        key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
        script: |
          # Load the new image
          docker load -i /tmp/${{ env.CONTAINER_NAME }}.tar.gz

          # Stop and remove existing container if running
          docker stop ${{ env.CONTAINER_NAME }} || true
          docker rm ${{ env.CONTAINER_NAME }} || true

          # Run the new container
          docker run -d \
            --name ${{ env.CONTAINER_NAME }} \
            --cpus=0.3 \
            --memory=384m \
            -p 72:8080 \
            -e ASPNETCORE_ENVIRONMENT=${{ env.ENVIRONMENT }} \
            -e ConnectionStrings__DefaultConnection="${{ secrets.ERPEZ_DB_CONNECTION_STRING }}" \
            -e AzureBlobStorage__ConnectionString="${{ secrets.AZURE_BLOB_STORAGE_CONNECTION_STRING }}" \
            --restart unless-stopped \
            ${{ env.CONTAINER_NAME }}:${{ env.IMAGE_TAG }}

          # Clean up transferred image
          rm -f /tmp/${{ env.CONTAINER_NAME }}.tar.gz