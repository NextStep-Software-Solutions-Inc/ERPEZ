name: Deploy Dashboard FE to Vercel (Prod)

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths:
      - 'apps/dashboard/**'
      - 'packages/erpez-shared-lib/**'
      - 'packages/ui/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - .github/workflows/deploy-dashboard-fe-prod.yml
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual production deployment'
        required: false
        default: 'Manual frontend production release'
        type: string

env:
  APP_NAME: dashboard
  ENVIRONMENT: Production

jobs:
  test:
    name: Validate Environment Config & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Environment & Dynamic Routing Tests
        run: pnpm --filter dashboard exec vitest run src/config/env.test.ts src/config/tenantEnv.test.ts

  deploy:
    name: Deploy to Production Vercel
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DASHBOARD }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts (Validate Build Output)
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DASHBOARD }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (Production)
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DASHBOARD }}
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
