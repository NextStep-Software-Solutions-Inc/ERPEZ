name: Backend CI

on:
  push:
    branches:
      - development
      - master
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - development
      - master
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  test:
    name: Build and Test All Backend Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore apps/backend/ERPEZ.sln

      - name: Build solution (TreatWarningsAsErrors)
        run: dotnet build apps/backend/ERPEZ.sln --no-restore --configuration Release /p:TreatWarningsAsErrors=true

      - name: Check Validation Coverage
        run: |
          echo "Checking FluentValidation coverage..."
          bash scripts/check-validators.sh
        shell: bash
        continue-on-error: false

      - name: Check DTO Contract Compliance
        run: |
          echo "Checking API contract compliance (DTOs vs Domain Entities)..."
          bash scripts/check-dto-contracts.sh
        shell: bash
        continue-on-error: false

      - name: Run Backend Unit & Security Tests
        run: dotnet test apps/backend/ERPEZ.sln --no-build --configuration Release --verbosity normal --nologo
