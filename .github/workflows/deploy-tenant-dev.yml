name: Deploy ERPEZ Tenant Management to DigitalOcean Droplet (Dev)

on:
  push:
    branches:
      - development
    paths:
      - 'TenantManagement/**'
      - .github/workflows/deploy-tenant-dev.yml
  pull_request:
    branches:
      - development
    paths:
      - 'TenantManagement/**'
      - .github/workflows/deploy-tenant-dev.yml
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        required: false
        default: 'Manual deployment'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Development

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./TenantManagement
        push: true
        tags: ${{ secrets.DOCKER_HUB_USERNAME }}/erpez-tenant-management:dev

  deploy:
    runs-on: ubuntu-latest
    environment: Development
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Deploy to DigitalOcean Droplet
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.DO_DROPLET_IP }}
        username: ${{ secrets.DO_DROPLET_USER }}
        key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
        script: |
          # Stop and remove existing container if running
          docker stop erpez-tenant-management-app || true
          docker rm erpez-tenant-management-app || true
          
          # Pull the latest image
          docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/erpez-tenant-management:dev
          
          # Run the new container
          docker run -d \
            --name erpez-tenant-management-app \
            --cpus=0.5 \
            -p 71:80 \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e ConnectionStrings__DefaultConnection="${{ secrets.DB_CONNECTION_STRING }}" \
            --restart unless-stopped \
            ${{ secrets.DOCKER_HUB_USERNAME }}/erpez-tenant-management:dev