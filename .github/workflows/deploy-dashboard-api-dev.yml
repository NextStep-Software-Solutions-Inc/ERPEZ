name: Deploy Dashboard API to VPS (Dev)

on:
  push:
    branches:
      - development
    paths:
      - 'apps/backend/Dashboard/**'
      - 'apps/backend/Shared/**'
      - .github/workflows/deploy-dashboard-api-dev.yml
  pull_request:
    branches:
      - development
    paths:
      - 'apps/backend/Dashboard/**'
      - 'apps/backend/Shared/**'
      - .github/workflows/deploy-dashboard-api-dev.yml
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        required: false
        default: 'Manual deployment'
        type: string

env:
    CONTAINER_NAME: dashboard-api
    IMAGE_TAG: dev
    ENVIRONMENT: Development

jobs:
  test:
    name: Run Tests and Validation Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore apps/backend/ERPEZ.sln
    
    - name: Build solution (treat warnings as errors)
      run: dotnet build apps/backend/ERPEZ.sln --no-restore --configuration Release /p:TreatWarningsAsErrors=true
    
    - name: Check Validation Coverage
      run: |
        echo "Checking FluentValidation coverage..."
        bash scripts/check-validators.sh
      shell: bash
      continue-on-error: false
    
    - name: Check DTO Contract Compliance
      run: |
        echo "Checking API contract compliance (DTOs vs Domain Entities)..."
        bash scripts/check-dto-contracts.sh
      shell: bash
      continue-on-error: false
    
    - name: Run Tests
      run: dotnet test apps/backend/ERPEZ.sln --no-build --configuration Release --verbosity normal --nologo
      continue-on-error: false

  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: Development
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: docker build -t ${{ env.CONTAINER_NAME }}:${{ env.IMAGE_TAG }} -f apps/backend/Dashboard/Dockerfile apps/backend

    - name: Save Docker image
      run: docker save ${{ env.CONTAINER_NAME }}:${{ env.IMAGE_TAG }} | gzip > ${{ env.CONTAINER_NAME }}.tar.gz

    - name: Transfer files to VPS via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        source: "${{ env.CONTAINER_NAME }}.tar.gz,apps/backend/Dashboard/docker-compose.yml"
        target: "/tmp"

    - name: Deploy on VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        script: |
          # Move the transferred docker-compose.yml to the correct folder
          mkdir -p /opt/docker-stack/dashboard-api
          mv /tmp/apps/backend/Dashboard/docker-compose.yml /opt/docker-stack/dashboard-api/docker-compose.yml
          rm -rf /tmp/apps

          # Load the new image
          docker load -i /tmp/${{ env.CONTAINER_NAME }}.tar.gz
          rm -f /tmp/${{ env.CONTAINER_NAME }}.tar.gz

          # Deploy via docker compose
          export PORT=72
          export DB_CONNECTION_STRING="${{ secrets.ERPEZ_DB_CONNECTION_STRING }}"
          export BLOB_CONNECTION_STRING="${{ secrets.AZURE_BLOB_STORAGE_CONNECTION_STRING }}"
          cd /opt/docker-stack/dashboard-api
          docker compose down
          docker compose up -d